[build]
  command = "npm run export"
  publish = ".artifacts/site"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/api/analysis"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
