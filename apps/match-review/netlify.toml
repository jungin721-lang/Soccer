# Use repository root as Base directory and this file as the configuration file.
[build]
  command = "npm run export:review"
  publish = ".artifacts/review"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "24"
[functions]
  node_bundler = "esbuild"
[functions."growth-worker-background"]
  included_files = ["node_modules/ffmpeg-static/ffmpeg"]
  external_node_modules = ["ffmpeg-static"]
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
