function makeWeeks(content) {
  return content.stages.map(([title, detail, target], index) => {
    const review = [
      ['오늘의 발견 한 줄', '잘된 시도 하나와 다음에 시도할 행동 하나를 아이의 말로 적어봐요.', '점수보다 실제로 해본 행동을 돌아봐요.'],
      ['나에게 도움이 된 말', '어려웠을 때 다시 시도하는 데 도움이 된 말이나 방법을 하나 정해요.', '부모는 답을 정하지 않고 먼저 들어주세요.'],
      ['내가 느낀 변화', '첫 주보다 편해진 점과 여전히 어려운 점을 하나씩 이야기해요.', '실천하기 어려웠다면 과제와 시간을 함께 조절해요.'],
      ['다음 한 걸음 정하기', '달라진 점을 인정하고 아이와 코치가 다음 달에 이어갈 목표를 하나 정해요.', '같은 목표를 이어가도 괜찮아요.'],
    ][index];
    return [
      { title, detail, minutes: index === 3 ? '경기 장면 · 5~10분' : '5~8분 · 조절 가능', target },
      index === 3
        ? { title: '같은 기준으로 다시 보기', detail: `새 경기에서 비교 가능한 장면을 기록하고 첫 기록과 살펴봐요. ${content.cue}`, minutes: '5~10분', target: '성공 여부와 함께 관찰 기회와 경기 조건도 확인해요.' }
        : { title: index === 0 ? '천천히 연결해보기' : index === 1 ? '선택하며 연결해보기' : '팀 훈련에서 시도해보기', detail: content.transfer, minutes: '5~8분 · 팀 훈련에 포함', target: content.cue },
      { title: review[0], detail: review[1], minutes: '5분 이내', target: review[2] },
    ];
  });
}

/**
 * Rule-based youth practice suggestions derived only from rated, observed skills.
 * @returns {{focus:string,label:string,title:string,personalized:boolean,sourceCount:number,note:string,weeks:Array<Array<{title:string,detail:string,minutes:string,target:string}>>}}
 */
function deriveTrainingPlan(observations = []) {
  const rated = getScores(observations).filter(score => score.value !== null && score.count > 0);
  // SKILLS order provides a stable tie-breaker; unobserved skills never compete.
  const lowest = rated.reduce((selected, score) => !selected || score.value < selected.value ? score : selected, null);
  const focus = lowest?.id || 'scan';
  const content = CONTENT[focus];
  return {
    focus,
    label: SKILLS.find(skill => skill.id === focus).name,
    title: content.title,
    personalized: Boolean(lowest),
    sourceCount: lowest?.count || 0,
    note: LOAD_NOTE,
    weeks: makeWeeks(content),
  };
}

const MAX_VIDEO_BYTES = 2 * 1024 * 1024 * 1024;

const DATABASE_NAME = 'next-xi-originals-v1';
const STORE_NAME = 'files';
const VIDEO_EXTENSIONS = new Set(['mp4', 'mov', 'm4v', 'webm', '3gp']);
const GENERIC_VIDEO_TYPES = new Set(['application/octet-stream', 'application/mp4']);
const QUOTA_MESSAGE = '기기 저장 공간이 부족합니다. 불필요한 영상을 삭제하거나 더 짧은 영상을 선택해 주세요.';
const STORAGE_MESSAGE = '이 브라우저에서 원본 영상을 저장할 수 없습니다. Safari 또는 Chrome의 일반 모드에서 다시 시도해 주세요.';

function validateVideoFile(file) {
  if (!file || !Number.isFinite(file.size) || file.size <= 0) {
    throw new Error('비어 있는 파일입니다. 원본 영상 파일을 다시 선택해 주세요.');
  }
  if (file.size > MAX_VIDEO_BYTES) {
    throw new Error('영상은 최대 2 GB까지 등록할 수 있습니다. 영상을 나누거나 더 짧은 파일을 선택해 주세요.');
  }
  const extension = typeof file.name === 'string' ? file.name.match(/\.([a-z0-9]+)$/i)?.[1].toLowerCase() : '';
  const type = typeof file.type === 'string' ? file.type.toLowerCase().split(';')[0].trim() : '';
  if (!VIDEO_EXTENSIONS.has(extension) || (type && !type.startsWith('video/') && !GENERIC_VIDEO_TYPES.has(type))) {
    throw new Error('MP4, MOV, M4V, WebM 또는 3GP 영상 파일을 선택해 주세요.');
  }
  return file;
}

function formatBytes(value) {
  if (!Number.isFinite(value) || value <= 0) return '0 B';
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  const index = Math.max(0, Math.min(Math.floor(Math.log(value) / Math.log(1024)), units.length - 1));
  const amount = value / 1024 ** index;
  return `${Number(amount.toFixed(index ? 1 : 0)).toLocaleString('ko-KR')} ${units[index]}`;
}

function readVideoMetadata(file) {
  validateVideoFile(file);
  return new Promise((resolve) => {
    const result = { duration: 0, width: 0, height: 0, playable: false };
    if (!globalThis.document?.createElement || !globalThis.URL?.createObjectURL) {
      resolve(result);
      return;
    }
    let video;
    let objectUrl;
    let timer;
    let settled = false;
    const finish = (playable = false) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      if (video) {
        result.duration = Number.isFinite(video.duration) && video.duration > 0 ? video.duration : 0;
        result.width = Number.isFinite(video.videoWidth) ? video.videoWidth : 0;
        result.height = Number.isFinite(video.videoHeight) ? video.videoHeight : 0;
        result.playable = playable && result.width > 0 && result.height > 0;
        video.onloadedmetadata = null;
        video.onloadeddata = null;
        video.onerror = null;
        try {
          video.removeAttribute('src');
          video.load();
        } catch {
          // Cleanup must not leave the metadata promise unresolved.
        }
      }
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      resolve(result);
    };
    try {
      video = document.createElement('video');
      video.preload = 'metadata';
      video.muted = true;
      video.playsInline = true;
      // Container metadata can be readable even when its video codec is not.
      // Wait for the first decoded frame before marking the preview playable.
      video.onloadedmetadata = () => { if (video.readyState >= 2) finish(true); };
      video.onloadeddata = () => finish(true);
      video.onerror = () => finish(false);
      timer = setTimeout(() => finish(false), 12_000);
      objectUrl = URL.createObjectURL(file);
      video.src = objectUrl;
      video.load();
    } catch {
      // A recognised container may have a codec the current browser cannot
      // decode. Keep the original instead of rejecting a legitimate file.
      finish(false);
    }
  });
}

function storageError(error) {
  if (['QuotaExceededError', 'NS_ERROR_DOM_QUOTA_REACHED'].includes(error?.name)) return new Error(QUOTA_MESSAGE);
  if (error?.message === QUOTA_MESSAGE || error?.message === STORAGE_MESSAGE) return error;
  return new Error(STORAGE_MESSAGE, { cause: error });
}

function validateId(id) {
  if (typeof id !== 'string' || !id.trim() || id.length > 200) {
    throw new Error('영상 식별 정보가 올바르지 않습니다. 다시 등록해 주세요.');
  }
}

function openDatabase() {
  return new Promise((resolve, reject) => {
    if (!globalThis.indexedDB) {
      reject(new Error(STORAGE_MESSAGE));
      return;
    }
    let request;
    let failed = false;
    try {
      request = indexedDB.open(DATABASE_NAME, 1);
    } catch (error) {
      reject(storageError(error));
      return;
    }
    request.onupgradeneeded = () => {
      if (!request.result.objectStoreNames.contains(STORE_NAME)) {
        request.result.createObjectStore(STORE_NAME, { keyPath: 'id' });
      }
    };
    request.onerror = () => reject(storageError(request.error));
    request.onblocked = () => {
      failed = true;
      reject(new Error('다른 탭에서 영상 저장소를 사용하고 있습니다. NEXT XI 탭을 닫은 뒤 다시 시도해 주세요.'));
    };
    request.onsuccess = () => {
      const database = request.result;
      database.onversionchange = () => database.close();
      if (failed) database.close();
      else resolve(database);
    };
  });
}

function transact(database, mode, operation) {
  return new Promise((resolve, reject) => {
    let transaction;
    try {
      transaction = database.transaction(STORE_NAME, mode);
      const request = operation(transaction.objectStore(STORE_NAME));
      let value;
      request.onsuccess = () => { value = request.result; };
      // A successful request does not guarantee that the transaction committed.
      transaction.oncomplete = () => resolve(value);
      transaction.onabort = () => reject(storageError(transaction.error || request.error));
      transaction.onerror = () => reject(storageError(transaction.error || request.error));
    } catch (error) {
      if (transaction) transaction.abort();
      reject(storageError(error));
    }
  });
}

async function checkStorageSpace(file) {
  let estimate;
  try {
    estimate = await globalThis.navigator?.storage?.estimate?.();
  } catch {
    // Storage estimates are optional and may be unavailable in private mode.
  }
  if (estimate && Number.isFinite(estimate.quota) && estimate.quota > 0 && Number.isFinite(estimate.usage)) {
    if (file.size > Math.max(0, estimate.quota - estimate.usage)) throw new Error(QUOTA_MESSAGE);
  }
}

async function saveVideo(id, file) {
  validateId(id);
  validateVideoFile(file);
  await checkStorageSpace(file);
  const database = await openDatabase();
  try {
    await transact(database, 'readwrite', (store) => store.put({ id, blob: file, savedAt: new Date().toISOString() }));
  } finally {
    database.close();
  }
}

function saveOriginalVideo(id, file) {
  return saveVideo(id, file);
}

async function loadVideo(id) {
  validateId(id);
  const database = await openDatabase();
  try {
    const record = await transact(database, 'readonly', (store) => store.get(id));
    return record?.blob instanceof Blob ? record.blob : null;
  } finally {
    database.close();
  }
}

function getOriginalVideo(id) {
  return loadVideo(id);
}

async function removeVideo(id) {
  validateId(id);
  const database = await openDatabase();
  try {
    await transact(database, 'readwrite', (store) => store.delete(id));
  } finally {
    database.close();
  }
}

function deleteOriginalVideo(id) {
  return removeVideo(id);
}

// Planning uses only timestamps and detections. It never scores a player or
// assumes that unsampled time has been observed.
function makeAutoScanPlan(duration) {
  if (!Number.isFinite(duration) || duration < 1 || duration > 86400) {
    throw new Error('자동 분석은 1초 이상, 24시간 이하의 원본 영상에서 이용할 수 있습니다.');
  }
  const lastTime = Math.max(0, duration - Math.min(0.1, duration / 10));
  const sampleCount = Math.min(120, Math.max(2, Math.ceil(lastTime / 5) + 1));
  const interval = lastTime / (sampleCount - 1);
  const times = Array.from({ length: sampleCount }, (_, index) => index === sampleCount - 1 ? lastTime : index * interval);
  return { duration, sampleCount, interval, times };
}

function selectAutoSegments(detections, duration, maximum = 6) {
  makeAutoScanPlan(duration);
  if (!Array.isArray(detections) || !Number.isInteger(maximum) || maximum < 1 || maximum > 6) return [];
  const length = Math.min(12, duration);
  const candidates = detections.filter(item => item && Number.isFinite(item.time) && item.time >= 0 && item.time <= duration && ['medium', 'high'].includes(item.confidence)).map(item => {
    const start = Math.max(0, Math.min(duration - length, item.time - length / 2));
    let end = Math.min(duration, start + length);
    // Avoid an IEEE-754 subtraction of 12.000000000000002 at fractional times.
    if (end - start > 12) end -= 0.000001;
    return { start, end, time: item.time, confidence: item.confidence };
  }).sort((a, b) => a.start - b.start || Number(b.confidence === 'high') - Number(a.confidence === 'high'));
  const unique = candidates.filter((item, index) => index === 0 || Math.abs(item.start - candidates[index - 1].start) > 0.001);
  const selected = [];
  const compatible = item => selected.every(other => item.start >= other.end || item.end <= other.start);
  while (selected.length < maximum) {
    const remaining = unique.filter(compatible);
    if (!remaining.length) break;
    // Begin with the earliest visible evidence, then cover the most distant
    // remaining evidence. This prevents six adjacent detections using the budget.
    let next = remaining[0];
    if (selected.length) {
      const distance = item => Math.min(...selected.map(other => Math.abs((item.start + item.end) / 2 - (other.start + other.end) / 2)));
      next = remaining.reduce((best, item) => {
        const difference = distance(item) - distance(best);
        if (difference > 0.000001 || (Math.abs(difference) <= 0.000001 && item.confidence === 'high' && best.confidence !== 'high')) return item;
        return best;
      });
    }
    selected.push(next);
  }
  return selected.sort((a, b) => a.start - b.start).map(({ start, end }) => ({ start, end }));
}


// Only sampled still images and selected short segments go to the server. The original
// video stays in the browser, and credentials for the AI provider never belong
// in this module or the generated static page.
const ANALYSIS_ENDPOINT = '/api/analysis';
const ANALYSIS_MAX_SECONDS = 12;
const ANALYSIS_MAX_FRAMES = 24;
const ANALYSIS_FRAME_INTERVAL = 0.5;
const ANALYSIS_FRAME_BYTES = 250_000;
const ANALYSIS_PAYLOAD_BYTES = 3_000_000;
const ANALYSIS_LONG_EDGE = 1280;

function analysisCancelledError() {
  const error = new Error('분석을 취소했습니다. 영상은 기기에 그대로 보관됩니다.');
  error.name = 'AbortError';
  return error;
}

function analysisCheckSignal(signal) {
  if (signal?.aborted) throw analysisCancelledError();
}

function analysisByteLength(value) {
  return new TextEncoder().encode(value).byteLength;
}

function analysisContentIsJSON(response) {
  return (response.headers.get('content-type') || '').toLowerCase().includes('application/json');
}

function analysisHTTPError(status, code) {
  if (code === 'analysis_credentials_rejected') return new Error('OpenAI가 서버의 API 키 인증을 거절했습니다. 운영자가 Netlify에 등록한 전체 API 키와 호출 권한을 확인해야 합니다.');
  if (code === 'analysis_timeout') return new Error('AI 응답 시간이 초과됐습니다. 완료된 결과는 보관되어 있으니 이어서 분석할 수 있습니다.');
  if (code === 'analysis_invalid_result') return new Error('장면 근거를 확인할 수 있는 AI 응답을 받지 못했습니다. 이번 구간의 관찰을 만들지 않았으며 완료된 결과는 보관됩니다.');
  if (status === 401 || status === 403) return new Error('분석 이용 코드가 올바르지 않습니다. 코드를 확인한 뒤 다시 시도해 주세요.');
  if (status === 404 || status === 405) return new Error('이 사이트에 분석 서버가 연결되지 않았습니다. 원본 저장은 완료되어 있으며, 분석 서버 연결 후 평가할 수 있습니다.');
  if (status === 413) return new Error('장면 전송 용량이 허용 크기를 넘었습니다. 완료된 결과는 보관되며 다시 시도할 수 있습니다.');
  if (status === 429) return new Error('지금은 분석 요청이 많습니다. 잠시 후 다시 시도해 주세요.');
  if (status === 503) return new Error('분석 서버 설정이 아직 완료되지 않았습니다. 원본 저장과 재생은 계속 이용할 수 있습니다.');
  if (status === 400 || status === 422) return new Error('영상 장면을 분석 요청으로 처리하지 못했습니다. 완료된 결과는 보관되며 다시 시도할 수 있습니다.');
  return new Error('분석 서버에서 결과를 받지 못했습니다. 원본은 보관되어 있으니 잠시 후 다시 시도해 주세요.');
}

async function getAnalysisAvailability() {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 8_000);
  try {
    const response = await fetch(ANALYSIS_ENDPOINT, {
      method: 'GET',
      headers: { Accept: 'application/json' },
      cache: 'no-store',
      signal: controller.signal,
    });
    // Static hosts commonly return index.html with status 200 for unknown URLs.
    // That is not an analysis API and must not be presented as ready.
    if (response.status === 404 || response.status === 405 || !analysisContentIsJSON(response)) {
      return { available: false, reason: 'backend_missing' };
    }
    let payload;
    try { payload = await response.json(); }
    catch { return { available: false, reason: 'invalid_response' }; }
    if (typeof payload?.available !== 'boolean') return { available: false, reason: 'invalid_response' };
    if (!response.ok && payload.available) return { available: false, reason: 'server_error' };
    const reason = typeof payload.reason === 'string' && /^[a-z0-9_]{1,80}$/i.test(payload.reason) ? payload.reason : (payload.available ? 'ready' : 'not_configured');
    return { available: response.ok && payload.available, reason };
  } catch {
    return { available: false, reason: controller.signal.aborted ? 'timeout' : 'network_error' };
  } finally {
    clearTimeout(timer);
  }
}

function analysisWaitForVideo(video, { events, predicate, signal, message, trigger, timeout = 15_000 }) {
  return new Promise((resolve, reject) => {
    let settled = false;
    let timer;
    const clean = () => {
      clearTimeout(timer);
      for (const name of events) video.removeEventListener(name, check);
      video.removeEventListener('error', failed);
      signal?.removeEventListener('abort', aborted);
    };
    const finish = (error) => {
      if (settled) return;
      settled = true;
      clean();
      if (error) reject(error);
      else resolve();
    };
    const check = () => {
      if (video.error) { failed(); return; }
      if (predicate()) finish();
    };
    const failed = () => finish(new Error('이 기기에서 영상을 해독할 수 없습니다. MP4(H.264) 영상으로 다시 저장해 주세요.'));
    const aborted = () => finish(analysisCancelledError());
    for (const name of events) video.addEventListener(name, check);
    video.addEventListener('error', failed);
    signal?.addEventListener('abort', aborted, { once: true });
    timer = setTimeout(() => finish(new Error(message)), timeout);
    if (signal?.aborted) { aborted(); return; }
    try {
      trigger?.();
      check();
    } catch {
      finish(new Error('영상 장면을 불러오지 못했습니다. 영상을 다시 선택해 주세요.'));
    }
  });
}

function analysisValidateOriginal({ blob, videoId, accessCode, consent, signal }) {
  analysisCheckSignal(signal);
  if (!(blob instanceof Blob) || blob.size <= 0) throw new Error('분석할 원본 파일을 이 기기에서 찾지 못했습니다. 원본을 다시 연결해 주세요.');
  if (typeof videoId !== 'string' || !videoId.trim() || videoId.length > 200) throw new Error('영상 정보를 확인할 수 없습니다. 원본을 다시 연결해 주세요.');
  if (typeof accessCode !== 'string' || !accessCode.trim() || accessCode.length > 256) throw new Error('분석 이용 코드를 입력해 주세요.');
  if (consent !== true) throw new Error('선택한 장면을 분석 서버에 전송하는 데 동의해 주세요.');
  if (!globalThis.document?.createElement || !globalThis.URL?.createObjectURL) throw new Error('이 브라우저에서는 영상 장면을 준비할 수 없습니다. 최신 Safari 또는 Chrome에서 이용해 주세요.');
}

function analysisValidateRequest(request) {
  const { start, end, referenceTime } = request;
  // Validate timestamps before accessing the browser, including in a plain Node
  // environment where only request-boundary tests run.
  if (!Number.isFinite(start) || !Number.isFinite(end) || start < 0 || end - start < 1 || end - start > ANALYSIS_MAX_SECONDS) {
    throw new Error('영상 안에서 1~12초 길이의 분석 구간을 선택해 주세요.');
  }
  if (referenceTime !== undefined && (!Number.isFinite(referenceTime) || referenceTime < start || referenceTime >= end)) throw new Error('선수 식별 근거의 시각이 분석 구간과 일치하지 않습니다.');
  analysisValidateOriginal(request);
}

async function analysisOpenVideo(blob, signal, onProgress) {
  const video = document.createElement('video');
  const canvas = document.createElement('canvas');
  let objectURL;
  const close = () => {
    try { video.pause(); video.removeAttribute('src'); video.load(); }
    catch { /* An unsupported codec must not prevent resource cleanup. */ }
    canvas.width = 0;
    canvas.height = 0;
    if (objectURL) { URL.revokeObjectURL(objectURL); objectURL = null; }
  };
  try {
    video.preload = 'auto';
    video.muted = true;
    video.playsInline = true;
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    objectURL = URL.createObjectURL(blob);
    onProgress?.({ stage: 'preparing', message: '원본 영상의 길이와 재생 상태를 확인하고 있어요.' });
    await analysisWaitForVideo(video, {
      events: ['loadedmetadata', 'loadeddata', 'canplay', 'progress'],
      predicate: () => video.readyState >= 2 && video.videoWidth > 0 && video.videoHeight > 0,
      signal,
      message: '원본 영상을 여는 시간이 길어지고 있습니다. MP4 영상인지 확인한 뒤 다시 시도해 주세요.',
      trigger: () => { video.src = objectURL; video.load(); },
      timeout: 20_000,
    });
    makeAutoScanPlan(video.duration);
    const context = canvas.getContext('2d', { alpha: false });
    if (!context) throw new Error('이 브라우저에서 영상 장면을 준비하지 못했습니다. Safari 또는 Chrome에서 다시 시도해 주세요.');
    return { video, canvas, context, duration: video.duration, close };
  } catch (error) {
    close();
    throw error;
  }
}

async function analysisCaptureFrame(session, target, { signal, longEdge = ANALYSIS_LONG_EDGE, maxBytes = ANALYSIS_FRAME_BYTES, start = 0, end = session.duration } = {}) {
  const { video, canvas, context } = session;
  analysisCheckSignal(signal);
  const needsSeek = Math.abs(video.currentTime - target) > 0.001;
  let seekCompleted = !needsSeek;
  const markSeeked = () => { seekCompleted = true; };
  if (needsSeek) video.addEventListener('seeked', markSeeked);
  try {
    await analysisWaitForVideo(video, {
      events: ['seeked', 'loadeddata', 'canplay'],
      predicate: () => seekCompleted && !video.seeking && video.readyState >= 2 && Math.abs(video.currentTime - target) < 0.1,
      signal,
      message: '영상 장면을 불러오지 못했습니다. 완료된 결과는 보관되며 다시 시도할 수 있습니다.',
      trigger: () => { if (needsSeek) video.currentTime = target; },
    });
  } finally {
    if (needsSeek) video.removeEventListener('seeked', markSeeked);
  }
  analysisCheckSignal(signal);
  let image;
  let edge = longEdge;
  do {
    const scale = Math.min(1, edge / Math.max(video.videoWidth, video.videoHeight));
    canvas.width = Math.max(1, Math.round(video.videoWidth * scale));
    canvas.height = Math.max(1, Math.round(video.videoHeight * scale));
    try {
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      image = canvas.toDataURL('image/jpeg', 0.6);
    } catch {
      throw new Error('이 장면을 이미지로 준비하지 못했습니다. MP4 원본으로 다시 시도해 주세요.');
    }
    if (!image.startsWith('data:image/jpeg;base64,')) throw new Error('영상 장면을 JPEG 이미지로 준비하지 못했습니다.');
    if (analysisByteLength(image) <= maxBytes) break;
    edge = Math.floor(edge * 0.8);
  } while (edge >= 256);
  if (analysisByteLength(image) > maxBytes) throw new Error('장면 이미지의 용량을 줄이지 못했습니다. 완료된 결과는 보관되며 다시 시도할 수 있습니다.');
  return { time: Math.max(start, Math.min(end, video.currentTime)), image };
}

async function analysisExtractFrames({ blob, start, end, referenceTime, onProgress, signal }) {
  const session = await analysisOpenVideo(blob, signal, onProgress);
  try {
    if (start >= session.duration || end > session.duration + 0.05) throw new Error('자동으로 준비한 구간이 영상 길이와 일치하지 않습니다. 처음부터 다시 분석해 주세요.');
    const count = Math.min(ANALYSIS_MAX_FRAMES, Math.ceil((end - start) / ANALYSIS_FRAME_INTERVAL));
    const times = Array.from({ length: count }, (_, index) => start + index * ANALYSIS_FRAME_INTERVAL).filter(time => time < end && time < session.duration);
    if (referenceTime !== undefined) {

  return `<div class="observation-list">${[...observations].reverse().map(o => `<article class="observation-item"><button class="time-chip" data-action="seek" data-id="${o.videoId}" data-time="${o.time}">${icon('play')}${formatTime(o.time)}</button><div><div class="observation-tags">${badge(SKILLS.find(s => s.id === o.skill)?.name || '', 'subtle')}${badge(({ strength: '좋았어요', focus: '연습해요', note: '관찰 기록' })[o.type], o.type === 'strength' ? 'green' : o.type === 'focus' ? 'amber' : 'subtle')}<span class="observation-rating">${o.rating ? o.rating + '/5단계' : '점수 없이 기록'}</span></div><p>${escape(o.note)}</p></div><button class="icon-button delete-observation" data-action="delete-observation" data-id="${escape(o.id)}" aria-label="${formatTime(o.time)} 장면 삭제">${icon('trash')}</button></article>`).join('')}</div>`;
}

function realInsights(data) {

}

async function persist(mutator) {

  pending = true;
  const next = structuredClone(state); mutator(next);
  document.body.classList.add('saving');
  try {
    const response = await localRequest('/api/workspace', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(next) });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || '저장하지 못했어요. 다시 시도해 주세요.');

    if (action === 'help') return openModal('성장의 다음 장, 이렇게 시작해요.', '남색 11번 선수의 경기에서 작은 발견을 찾아보세요.', `<ol class="guide-list"><li><span>01</span><div><strong>경기 영상 열기</strong><p>원본 파일 또는 유튜브 링크를 등록해요. 원본은 등록한 기기의 브라우저에서 보관·재생됩니다.</p></div></li><li><span>02</span><div><strong>남색 11번 자동 분석 시작</strong><p>원본 영상에서 자동 분석을 누르면 앱이 선수를 탐색하고 분석 구간을 고릅니다. 장면 선택이나 시작 시간 입력은 필요 없어요.</p></div></li><li><span>03</span><div><strong>피드백과 근거 함께 살펴보기</strong><p>앱이 분석한 구간별 강점과 연습할 행동을 확인해요. 스파이더맵은 사람이 직접 기록한 단계 평가를 별도로 표시합니다.</p></div></li><li><span>04</span><div><strong>작게 연습하고, 다시 돌아보기</strong><p>일반 훈련 예시를 코치와 조절하고, 다음 경기의 변화를 기록해요.</p></div></li></ol><div class="modal-actions"><button class="button primary" data-action="close-modal">시작해 볼게요 ${icon('arrow')}</button></div>`);
  } catch (e) { toast(e.message); }
}
document.addEventListener('click', e => {
  if (e.target.closest('.skip-link')) { e.preventDefault(); $('#main')?.focus(); return; }
  if (e.target.closest('.sidebar a[href^="#"]')) closeMobileMenu();
  actionHandler(e);
});
document.addEventListener('click', e => { if (e.target.classList.contains('modal-backdrop')) closeModal(); });
document.addEventListener('keydown', e => {
  const sourceTab = e.target.closest('[data-action=video-source]');
  if (sourceTab && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
    e.preventDefault(); const kind = e.key === 'Home' ? 'file' : e.key === 'End' ? 'youtube' : sourceTab.dataset.kind === 'file' ? 'youtube' : 'file';
    setVideoSource(kind); $(`[data-action=video-source][data-kind=${kind}]`)?.focus(); return;
  }
  const modal = $('.modal'); if (!modal) { if (e.key === 'Escape') { closeMobileMenu(); $('.mobile-menu')?.focus(); } return; }
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Tab') {
    const els = [...modal.querySelectorAll('button:not(:disabled), input:not(:disabled), select, textarea, a[href]')];
    if (!els.length) { e.preventDefault(); return; }
    const first = els[0], last = els.at(-1);
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
document.addEventListener('change', async e => {
  if (e.target.id === 'original-file') return selectOriginal(e.target.files[0]);
  if (e.target.id === 'reconnect-original') {
    const input = e.target, file = input.files[0];
    if (!file) return;
    try {
      validateVideoFile(file);
      const video = state.videos.find(v => v.id === input.dataset.id);
      if (!video || file.size !== video.size || file.name !== video.fileName) throw new Error('처음 등록했던 것과 이름·크기가 같은 원본을 선택해 주세요. 다른 영상은 새로 등록해 주세요.');
      input.disabled = true; await saveOriginalVideo(video.id, file); loadPlayer(false); toast('원본을 다시 연결했어요. 기존 기록을 이어갈 수 있어요.');
    } catch (err) { toast(err.message); input.disabled = false; input.value = ''; }
  }
});
document.addEventListener('submit', async e => {
  if (e.target.id === 'analysis-form') { e.preventDefault(); await submitAnalysis(e.target); return; }
  if (!['video-form', 'observation-form', 'profile-form'].includes(e.target.id)) return;
  e.preventDefault(); const form = e.target, data = new FormData(form), button = $('button[type=submit]', form); let error = $('[role=alert]', form);
  error.textContent = ''; button.disabled = true;
  try {
    if (form.id === 'video-form') {
      if (!data.get('rights')) throw new Error('영상 등록 권한을 확인해 주세요.');
      const title = data.get('title').trim(); if (!title) throw new Error('영상 이름을 입력해 주세요.');
      if (registrationKind === 'file') {
        if (!selectedOriginal) throw new Error('등록할 원본 영상 파일을 선택해 주세요.');
        const file = selectedOriginal, id = 'local-' + makeId();
        validateVideoFile(file);
        savingOriginal = true;
        form.setAttribute('aria-busy', 'true');
        $('#original-save-progress').hidden = false;
        form.querySelectorAll('input,button').forEach(el => el.disabled = true);
        $('.modal-heading .icon-button').disabled = true;
        try {
          const meta = await selectedMetadataPromise || selectedOriginalMeta || {};
          const record = { id, kind: 'file', title, start: 0, source: '원본 파일', addedAt: new Date().toISOString(), fileName: file.name, size: file.size, mime: file.type, duration: meta.duration && meta.duration <= 86400 ? meta.duration : null, lastModified: file.lastModified };
          await saveOriginalVideo(id, file);
          try { await persist(s => s.videos.unshift(record)); }
          catch (err) { try { await deleteOriginalVideo(id); } catch {} throw err; }
        } finally {
          savingOriginal = false; form.removeAttribute('aria-busy');
          if (form.isConnected) { form.querySelectorAll('input,button').forEach(el => el.disabled = false); $('.modal-heading .icon-button').disabled = false; $('#original-save-progress').hidden = true; }
        }
        selectedVideo = id; previewTime = 0; demo = false; closeModal(); navigate('dashboard');
        toast('원본 영상을 이 기기에 등록했어요. 클라우드로 전송되지 않습니다.');
      } else {
        const id = parseYouTube(data.get('url'));
        if (!id) throw new Error('올바른 YouTube 영상 주소를 입력해 주세요.');
        if (state.videos.some(v => v.id === id)) throw new Error('이미 등록된 영상이에요. 경기 목록에서 확인해 주세요.');
        const u = new URL(data.get('url')); const t = u.searchParams.get('t') || u.searchParams.get('start') || '0';
        let start = /^\d+s?$/.test(t) ? parseInt(t, 10) : /^\d+m\d+s$/.test(t) ? parseInt(t, 10) * 60 + parseInt(t.split('m')[1], 10) : 0;
        start = Math.min(86400, start);
        await persist(s => s.videos.push({ id, title, kind: 'youtube', source: '직접 등록', start, addedAt: new Date().toISOString() }));
        selectedVideo = id; previewTime = null; closeModal(); navigate('videos'); toast('경기 영상을 등록했어요. 남색 11번 선수를 확인해 주세요.');
      }
    } else if (form.id === 'observation-form') {
      const time = parseTimestamp(data.get('time')); if (time === null || time > 86400) throw new Error('시간을 00:57 또는 1:02:30 형식으로 입력해 주세요.');
      const note = data.get('note').trim(); if (!note) throw new Error('직접 관찰한 행동을 입력해 주세요.');

});
window.addEventListener('beforeunload', event => { if (analysisBusy) { event.preventDefault(); event.returnValue = ''; } });
window.addEventListener('hashchange', () => { page = location.hash.slice(1) || 'dashboard'; closeMobileMenu(); render(); window.scrollTo({ top: 0, behavior: 'instant' }); $('#main').focus({ preventScroll: true }); });
matchMedia('(max-width: 720px)').addEventListener('change', () => { closeMobileMenu(); });
async function init() {
  try { const response = await localRequest('/api/workspace'); if (!response.ok) throw new Error(); state = await response.json(); selectedVideo = state.videos[0]?.id; if ((state.autoAnalyses || []).some(job => ['scanning','analyzing'].includes(job.status))) await persist(s => s.autoAnalyses.forEach(job => { if (['scanning','analyzing'].includes(job.status)) { job.status = 'interrupted'; job.updatedAt = new Date().toISOString(); job.message = '화면이 닫혀 분석이 중단됐어요. 완료된 결과는 남아 있으며 이어서 분석할 수 있어요.'; } })); render(); }
